<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:component="http://xmlns.jcp.org/jsf/composite/components">

<ui:composition template="/pages/template/template.xhtml">
	<ui:define name="body">

		<script>
			$(document).ready(function() {
				select2();
			});
		</script>

		<div>
			<component:breadcrumb titulo="Vendas" imgTitulo="fa fa-tag"
				primeiro="Início" segundo="Vendas" terceiro="Incluir"
				imgPrimeiro="fa fa-home" imgSegundo="fa fa-tag"
				linkSegundo="/PadariaWeb/pages/vendas/listar" />
		</div>



		<!-- Header -->

		<div class="wrapper wrapper-content animated fadeInRight ecommerce">
			<div class="col-lg-12">
				<div class="tabs-container">
					<h:form prependId="false" enctype="multipart/form-data">
						<ul class="nav nav-tabs">
							<li class="active"><h:commandLink data-toggle="tab"
									action="#tab-1" value="Informações Venda" /></li>
						</ul>

						<div class="tab-content">
							<div id="tab-1" class="tab-pane active">
								<div class="panel-body">
									<fieldset class="form-horizontal">


										<h3>Nova Venda</h3>

										<div class="form-group">
											<label class="col-lg-2 control-label">Cliente</label>
											<div class="col-lg-4">
												<h:selectOneMenu value="#{vendaIncluirBean.venda.cliente}"
													converter="omnifaces.SelectItemsConverter"
													styleClass="form-control">
													<f:selectItem itemLabel="[nulo]"
														noSelectionOption="true" />
													<f:selectItems value="#{vendaIncluirBean.clientes}" var="c"
														itemLabel="#{c.nome}" itemValue="#{c}" />
												</h:selectOneMenu>
											</div>
										</div>

										<div class="form-group">
											<label class="col-lg-2 control-label">Produto</label>
											<div class="col-lg-4">
												<h:selectOneMenu
													value="#{vendaIncluirBean.produtoSelecionado}"
													converter="omnifaces.SelectItemsConverter"
													styleClass="form-control">
													<f:selectItem itemLabel="[selecione]"
														noSelectionOption="true" />
													<f:selectItems value="#{vendaIncluirBean.produtos}" var="p"
														itemLabel="#{p.nome}" itemValue="#{p}" />
												</h:selectOneMenu>
											</div>

											<label class="col-lg-1 control-label">Quantidade</label>
											<div class="col-lg-2">
												<h:inputText value="#{vendaIncluirBean.quantidade}"
													styleClass="form-control" placeholder="Quantidade">
													<f:convertNumber integerOnly="true" />
												</h:inputText>
											</div>

											<div class="col-lg-2">
												<h:commandButton value="Adicionar Produto"
													styleClass="btn btn-primary"
													action="#{vendaIncluirBean.adicionarProduto}" />
											</div>
										</div>

										<br />

										<h:dataTable value="#{vendaIncluirBean.itens}" var="item"
											styleClass="table table-striped table-bordered">

											<h:column>
												<f:facet name="header">Produto</f:facet>
												<h:outputText value="#{item.produto.nome}" />
											</h:column>

											<h:column>
												<f:facet name="header">Quantidade</f:facet>
												<h:outputText value="#{item.quantidade}" />
											</h:column>

											<h:column>
												<f:facet name="header">Preço Unitário</f:facet>
												<h:outputText value="#{item.precoUnitario}">
													<f:convertNumber type="currency" currencySymbol="R$ " />
												</h:outputText>
											</h:column>

											<h:column>
												<f:facet name="header">Subtotal</f:facet>
												<h:outputText value="#{item.subtotal}">
													<f:convertNumber type="currency" currencySymbol="R$ " />
												</h:outputText>
											</h:column>

											<h:column>
												<f:facet name="header">Ações</f:facet>

												<h:commandLink
													action="#{vendaIncluirBean.removerItem(item)}"
													title="Remover Item">
													<i class="fa fa-trash-o fa-fw" />
												</h:commandLink>
											</h:column>

										</h:dataTable>

										<h3>
											Total:
											<h:outputText value="#{vendaIncluirBean.total}">
												<f:convertNumber type="currency" currencySymbol="R$ " />
											</h:outputText>
										</h3>

										<div class="hr-line-dashed"></div>

										<h3>Pagamento</h3>

										<div class="form-group">
											<label class="col-lg-2 control-label">Tipo</label>
											<div class="col-lg-3">
												<h:selectOneMenu
													value="#{vendaIncluirBean.formaPagamento.tipo}"
													styleClass="form-control">
													<f:selectItem itemLabel="[selecione]" itemValue="" />
													<f:selectItem itemLabel="Dinheiro" itemValue="Dinheiro" />
													<f:selectItem itemLabel="PIX" itemValue="PIX" />
													<f:selectItem itemLabel="Débito" itemValue="Débito" />
													<f:selectItem itemLabel="Crédito" itemValue="Crédito" />
												</h:selectOneMenu>
											</div>

											<label class="col-lg-1 control-label">Bandeira</label>
											<div class="col-lg-3">
												<h:inputText
													value="#{vendaIncluirBean.formaPagamento.bandeira}"
													styleClass="form-control" placeholder="Bandeira" />
											</div>
										</div>

										<div class="form-group">
											<label class="col-lg-2 control-label">Parcelas</label>
											<div class="col-lg-3">
												<h:inputText
													value="#{vendaIncluirBean.formaPagamento.qtdParcelas}"
													styleClass="form-control" placeholder="Parcelas">
													<f:convertNumber integerOnly="true" />
												</h:inputText>
											</div>
										</div>

										<div class="hr-line-dashed"></div>

										<div class="form-group">
											<div class="col-lg-offset-2 col-lg-10">
												<h:commandButton value="Finalizar Venda"
													styleClass="btn btn-primary"
													action="#{vendaIncluirBean.finalizarVenda}" />

												<h:button value="Cancelar" styleClass="btn btn-default"
													style="margin-left: 15px" outcome="/pages/vendas/listar" />
											</div>
										</div>

									</fieldset>
								</div>
							</div>
						</div>

						<h:outputScript library="primefaces/fileupload"
							name="fileupload.js" />
						<h:outputScript library="js" name="jquery.maskedinput.js" />


						<script>
							$(document).ready(function() {
								$("#dtNascimento").datepicker();
								$("#dtNascimento").mask("99/99/9999");
								var config = {
									'.chosen-select' : {},
									'.chosen-select-deselect' : {
										allow_single_deselect : true
									},
									'.chosen-select-width' : {
										width : "95%"
									}
								}
								for ( var selector in config) {
									$(selector).chosen(config[selector]);
								}
							});
						</script>
					</h:form>
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
</html>
