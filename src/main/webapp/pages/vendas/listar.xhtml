<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:component="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:p="http://primefaces.org/ui">

<ui:composition template="/pages/template/template.xhtml">
	<ui:define name="body">

		<script>
			$(document).ready(function() {
				$('.demo4').click(function() {
					swal({
						title : "Você tem certeza?",
						text : "A venda será inativada no sistema!",
						type : "warning",
						showCancelButton : true,
						confirmButtonColor : "#DD6B55",
						confirmButtonText : "Cancelar Venda!",
						cancelButtonText : "Voltar",
						closeOnConfirm : false,
						closeOnCancel : true
					}, function(isConfirm) {
						if (isConfirm) {
							cancelar();
						}
					});
				});

				$('#resultadoDT').DataTable({
					"bInfo" : false,
					"destroy" : true,
					"language" : {
						"url" : "../../../resources/i18n/pt_BR.json"
					}
				});
			});
		</script>

		<div>
			<component:breadcrumb titulo="Vendas" imgTitulo="fa fa-tag"
				primeiro="Início" segundo="Vendas" imgPrimeiro="fa fa-home"
				imgSegundo="fa fa-tag" />
		</div>

		<h:form prependId="false">

			<div class="wrapper wrapper-content animated fadeInRight">

				<div class="row">
					<div class="col-lg-12">
						<div class="ibox float-e-margins">
							<div class="ibox-title">
								<i class="fa fa-filter fa-fw" /> Filtro
							</div>

							<div class="ibox-content">
								<div class="form-horizontal">

									<div class="form-group">
										<label class="col-lg-1 control-label" style="width: 130px;">ID
											da Venda</label>
										<div class="col-lg-2">
											<h:inputText value="#{vendaBean.filtro.sqVenda}"
												styleClass="form-control" placeholder="ID da Venda" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-lg-1 control-label" style="width: 130px;">Data
											Inicial</label>
										<div class="col-lg-2">
											<h:inputText value="#{vendaBean.dtInicial}"
												styleClass="form-control" placeholder="Data inicial">
												<f:convertDateTime pattern="dd/MM/yyyy" />
											</h:inputText>
										</div>
									</div>

									<div class="form-group">
										<label class="col-lg-1 control-label" style="width: 130px;">Data
											Final</label>
										<div class="col-lg-2">
											<h:inputText value="#{vendaBean.dtFinal}"
												styleClass="form-control" placeholder="Data final">
												<f:convertDateTime pattern="dd/MM/yyyy" />
											</h:inputText>
										</div>
									</div>

									<div class="form-group">
										<label class="col-lg-2 control-label">Cliente</label>

										<div class="col-lg-4">
											<h:selectOneMenu value="#{vendaBean.filtro.cliente}"
												converter="omnifaces.SelectItemsConverter"
												styleClass="form-control">

												<f:selectItem itemLabel="[selecione]" itemValue="#{null}" />

												<f:selectItems value="#{vendaBean.clientes}" var="c"
													itemLabel="#{c.nome}" itemValue="#{c}" />

											</h:selectOneMenu>
											
										</div>
									</div>

									<div class="form-group">
										<label class="col-lg-2 control-label">Funcionario</label>

										<div class="col-lg-4">
											<h:selectOneMenu value="#{vendaBean.filtro.funcionario}"
												converter="omnifaces.SelectItemsConverter"
												styleClass="form-control">

												<f:selectItem itemLabel="[selecione]" itemValue="#{null}" />

												<f:selectItems value="#{vendaBean.funcionarios}" var="f"
													itemLabel="#{f.nome}" itemValue="#{f}" />

											</h:selectOneMenu>
										</div>
									</div>

									<div class="form-group">
										<label class="col-lg-2 control-label">Status</label>

										<div class="col-lg-4">
											<h:selectOneMenu value="#{vendaBean.filtro.status}"
												styleClass="form-control">
												<f:selectItem itemLabel="[todos]" itemValue="" />
												<f:selectItem itemLabel="Ativa" itemValue="ATIVA" />
												<f:selectItem itemLabel="Cancelada" itemValue="CANCELADA" />
											</h:selectOneMenu>
										</div>
									</div>

									<div class="hr-line-dashed"></div>

									<div class="form-group">
										<div style="margin-left: 4%;">
											<h:commandLink styleClass="btn btn-primary"
												action="#{vendaBean.pesquisar}">
												<i class="fa fa-search fa-fw"></i> Pesquisar
                                            </h:commandLink>

											<h:commandLink styleClass="btn btn-default"
												style="margin-left: 15px" action="#{vendaBean.limpar}">
												<i class="fa fa-trash-o fa-fw"></i> Limpar
                                            </h:commandLink>

											<h:commandLink styleClass="btn btn-primary"
												style="float: right;margin-right: 30px;"
												action="#{vendaBean.incluir}">
												<i class="fa fa-plus fa-fw"></i> Incluir
                                            </h:commandLink>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="row">
					<h:panelGroup styleClass="col-lg-12">
						<div class="ibox float-e-margins">
							<div class="ibox-title">
								<span class="title" style="font-size: 16px; font-weight: 400;">Resultado</span>
							</div>

							<div class="ibox-content">
								<div class="table-responsive">
									<h:panelGroup class="panel-body" id="dataTable" layout="block">

										<div class="row">
											<div class="col-lg-4">
												<div class="ibox">
													<div class="ibox-title">
														<span>Total Vendido</span>
													</div>
													<div class="ibox-content">
														<h2>
															<h:outputText value="#{vendaBean.totalVendido}">
																<f:convertNumber type="currency" currencySymbol="R$ " />
															</h:outputText>
														</h2>
													</div>
												</div>
											</div>

											<div class="col-lg-4">
												<div class="ibox">
													<div class="ibox-title">
														<span>Vendas Ativas</span>
													</div>
													<div class="ibox-content">
														<h2>#{vendaBean.quantidadeVendas}</h2>
													</div>
												</div>
											</div>

											<div class="col-lg-4">
												<div class="ibox">
													<div class="ibox-title">
														<span>Ticket Médio</span>
													</div>
													<div class="ibox-content">
														<h2>
															<h:outputText value="#{vendaBean.ticketMedio}">
																<f:convertNumber type="currency" currencySymbol="R$ " />
															</h:outputText>
														</h2>
													</div>
												</div>
											</div>
										</div>
										<h:dataTable var="venda" id="resultadoDT"
											value="#{vendaBean.vendas}"
											styleClass="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">

											<h:column>
												<f:facet name="header">ID</f:facet>
												<h:outputText value="#{venda.sqVenda}" />
											</h:column>

											<h:column>
												<f:facet name="header">Data</f:facet>
												<h:outputText value="#{venda.dtVenda}">
													<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
												</h:outputText>
											</h:column>

											<h:column>
												<f:facet name="header">Cliente</f:facet>
												<h:outputText
													value="#{empty venda.cliente ? '-' : venda.cliente.nome}" />
											</h:column>

											<h:column>
												<f:facet name="header">Funcionário</f:facet>
												<h:outputText value="#{venda.funcionario.nome}" />
											</h:column>

											<h:column>
												<f:facet name="header">Total</f:facet>
												<h:outputText value="#{venda.vlTotal}">
													<f:convertNumber type="currency" currencySymbol="R$ " />
												</h:outputText>
											</h:column>

											<h:column>
												<f:facet name="header">Status</f:facet>
												<h:outputText value="#{venda.status}" />
											</h:column>

											<h:column headerClass="col-md-1 text-center">
												<f:facet name="header">Ações</f:facet>
												<div class="text-center">

													<h:commandLink action="#{vendaBean.visualizar}"
														title="Visualizar Venda">
														<i class="fa fa-eye fa-fw" />
														<f:setPropertyActionListener value="#{venda}"
															target="#{vendaBean.vendaSelecionada}" />
													</h:commandLink>

													<h:commandLink styleClass="demo4" title="Cancelar Venda"
														rendered="#{venda.status ne 'CANCELADA'}">
														<i class="fa fa-ban fa-fw" />
														<f:setPropertyActionListener value="#{venda}"
															target="#{vendaBean.vendaSelecionada}" />
														<f:ajax />
													</h:commandLink>

												</div>
											</h:column>

										</h:dataTable>

									</h:panelGroup>
								</div>
							</div>
						</div>
					</h:panelGroup>
				</div>

			</div>

			<p:remoteCommand name="cancelar"
				actionListener="#{vendaBean.remover}"
				oncomplete="location.reload();" />


		</h:form>

	</ui:define>
</ui:composition>
</html>
