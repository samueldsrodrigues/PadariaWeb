<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition template="/pages/template/template-simples.xhtml">
	<ui:define name="body">
		<h:form prependId="false">
			<div class="passwordBox animated fadeInDown">
		        <div class="row">
		            <div class="col-md-12" style="padding-top: 20%;">
		                <div class="ibox-content" style="width: 105%;padding-bottom: 0px;">
		                    <h2 class="font-bold" style="text-align: center;">Alteração de Senha</h2>
		                    <p>
		                        A senha deve ter no mínimo 8 caracteres e ser composta de letras e números.
		                    </p>
		                    <div class="row">
		                        <div class="col-lg-12">
	                            	<fieldset class="form-horizontal">
										<div class="form-group">
											<label class="col-lg-4 control-label">Senha atual: </label>
											<div class="col-lg-6">
												<p:password value="#{usuarioIncluirBean.senhaAtual}" styleClass="form-control" />
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-4 control-label">Nova Senha: </label>
											<div class="col-lg-6">
												<p:password value="#{usuarioIncluirBean.senha}" styleClass="form-control" />
											</div>
										</div>
										
										<div class="form-group">
											<label class="col-lg-4 control-label">Confirmar Senha: </label>
											<div class="col-lg-6">
												<p:password value="#{usuarioIncluirBean.confirmacaoSenha}" styleClass="form-control" />
											</div>
										</div>
										<div class="hr-line-dashed"></div>
										<div class="form-group">
											<div class="pull-left">
												<h:commandButton styleClass="btn btn-primary" value="Salvar" style="margin-left:20px" action="#{usuarioIncluirBean.salvarPrimeiroAcesso}" />
											</div>
										</div>
									</fieldset>
		                        </div>
		                    </div>
		                </div>
		            </div>
		        </div>
		    </div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
