
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:component="http://xmlns.jcp.org/jsf/composite/components">

<ui:composition template="/pages/template/template.xhtml">
	<ui:define name="body">

		<script>
			$(document).ready(function() {
				select2();
			});
		</script>

		<!-- Header -->
		<div>
			<component:breadcrumb titulo="Produto"
				imgTitulo="fa fa-check-square-o" primeiro="Início" segundo="Produto"
				terceiro="#{produtoIncluirBean.produto.sqProduto == null ? 'Incluir' : 'Editar'}"
				imgPrimeiro="fa fa-home" imgSegundo="fa fa-check-square-o" />
		</div>

		<div class="wrapper wrapper-content animated fadeInRight ecommerce">
			<div class="col-lg-12">
				<div class="tabs-container">
					<h:form prependId="false" enctype="multipart/form-data">
						<ul class="nav nav-tabs">
							<li class="active"><h:commandLink data-toggle="tab"
									action="#tab-1" value="Informações Produto" /></li>
						</ul>
						<div class="tab-content">
							<div id="tab-1" class="tab-pane active">
								<div class="panel-body">
									<fieldset class="form-horizontal">

										<div class="form-group">
											<label class="col-lg-2 control-label">Nome</label>
											<div class="col-lg-10">
												<p:inputText value="#{produtoIncluirBean.produto.nome}"
													styleClass="form-control" />
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Tipo</label>
											<div class="col-lg-10">
												<h:inputText value="#{produtoIncluirBean.produto.tipo}"
													styleClass="form-control" placeholder="Tipo do Produto" />
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Descrição</label>
											<div class="col-lg-10">
												<h:inputText value="#{produtoIncluirBean.produto.descricao}"
													styleClass="form-control"
													placeholder="Descrição do Produto" />
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Data de
												Validade</label>
											<div class="col-lg-10">
												<h:inputText
													value="#{produtoIncluirBean.produto.dtValidade}"
													styleClass="form-control" placeholder="dd/MM/yyyy">
													<f:convertDateTime pattern="dd/MM/yyyy" />
												</h:inputText>
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Estoque</label>
											<div class="col-lg-10">
												<h:inputText value="#{produtoIncluirBean.produto.estoque}"
													styleClass="form-control" placeholder="Estoque">
													<f:convertNumber integerOnly="true" />
												</h:inputText>
											</div>
										</div>

										<div class="form-group">
											<label class="col-lg-2 control-label">Preço</label>
											<div class="col-lg-10">
												<h:inputText
													value="#{produtoIncluirBean.valorProduto.preco}"
													styleClass="form-control" placeholder="Preço do Produto">
													<f:convertNumber />
												</h:inputText>
											</div>
										</div>

										<div class="form-group">
											<label class="col-lg-2 control-label">Desconto</label>
											<div class="col-lg-10">
												<h:inputText
													value="#{produtoIncluirBean.valorProduto.desconto}"
													styleClass="form-control" placeholder="Desconto">
													<f:convertNumber />
												</h:inputText>
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Imagem atual</label>
											<div class="col-lg-10">
												<h:graphicImage
													value="#{empty produtoIncluirBean.produto.imagem ? '/resources/img/produto-padrao1.png' : produtoIncluirBean.produto.imagem}"
													style="width: 100px; height: 100px; object-fit: cover;" />
											</div>
										</div>
										<div class="form-group">
											<label class="col-lg-2 control-label">Caminho da
												Imagem</label>
											<div class="col-lg-10">
												<h:inputText value="#{produtoIncluirBean.produto.imagem}"
													styleClass="form-control"
													placeholder="/resources/img/nome-da-imagem.jpg" />
											</div>
										</div>



										<div class="hr-line-dashed"></div>
										<div class="form-group">
											<div class="pull-left" style="padding-left: 12%;">
												<h:commandButton styleClass="btn btn-primary" value="Salvar"
													action="#{produtoIncluirBean.salvar}" />
												<h:button styleClass="btn btn-default"
													style="margin-left: 20px" value="Cancelar"
													outcome="/pages/produtos/listar" />
											</div>
										</div>
									</fieldset>
								</div>
							</div>
						</div>

						<h:outputScript library="primefaces/fileupload"
							name="fileupload.js" />
						<h:outputScript library="js" name="jquery.maskedinput.js" />

						<script>
							$(document).ready(function() {
								$("#dtNascimento").datepicker();
								$("#dtNascimento").mask("99/99/9999");
								var config = {
									'.chosen-select' : {},
									'.chosen-select-deselect' : {
										allow_single_deselect : true
									},
									'.chosen-select-width' : {
										width : "95%"
									}
								}
								for ( var selector in config) {
									$(selector).chosen(config[selector]);
								}
							});
						</script>
					</h:form>
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
</html>
