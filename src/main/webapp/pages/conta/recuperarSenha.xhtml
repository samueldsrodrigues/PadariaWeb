<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Bem-vindo ao Controle de Brinquedoteca</title>
	<link rel="stylesheet" href="#{request.contextPath}/resources/css/font-awesome.css" />
	<link rel="stylesheet" href="#{request.contextPath}/resources/css/bootstrap.css" />
	<link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css" />
	<link rel="stylesheet" href="#{request.contextPath}/resources/css/animate.css" />
	<h:outputScript library="js" name="jquery-2.1.1.js"/>
</h:head>
<h:body styleClass="gray-bg">
    <div class="passwordBox animated fadeInDown">
        <div class="row">
            <div class="col-md-12" style="padding-top: 40%;">
                <div class="ibox-content" style="width: 105%;">
                    <h2 class="font-bold" style="text-align: center;">Recuperar Senha</h2>
                    <p style="margin-bottom: 15px;">
                        Digite o seu email e sua senha será reiniciada e enviada a você.
                    </p>
                    <div class="row">
                        <div class="col-lg-12">
                            <h:form>
                            	<h:messages/>
                                <div class="form-group text-center">
                                	<ui:fragment rendered="#{recuperarSenhaBean.showEmailError == true}">
					                	<div class="label label-danger" style="font-size: medium;">e-mail inválido!</div>
					            	</ui:fragment>
                                    <h:inputText value="#{recuperarSenhaBean.email}" styleClass="form-control" style="margin-top: 15px;" placeholder="E-mail" required="true" requiredMessage="Campo E-mail é obrigatório!"/>
                                </div>
								<h:commandButton action="#{recuperarSenhaBean.recuperarSenha}" styleClass="btn btn-primary block full-width m-b" value="Enviar Senha"/>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
